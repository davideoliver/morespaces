          <h1>Contatos</h1>
        </header>
        <figure><img src="images/handshake.jpg" alt="Pessoas apertando as mãos" />

        </figure>
        <h2>Telefone local</h2>
        <p>(+000) 99999-9999</p>
        <h2>Mande sua mensagem</h2>
        <form action="/enviar" method="POST">
          <div><label for="nome">Nome:</label><input type="text" id="nome" name="nome" required /></div>
          <div><label for="contatoEmail">E-mail:</label><input type="email" id="contatoEmail" name="contatoEmail"
              required /></div>
          <div><label for="mensagem">Mensagem:</label><textarea id="mensagem" name="mensagem" required></textarea></div>
          <button type="submit">Enviar</button>
        </form>
